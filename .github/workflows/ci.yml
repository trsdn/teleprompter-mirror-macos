name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build und Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  bundle:
    name: App-Bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Icon erzeugen
        run: swift Scripts/make-icon.swift
      - name: Bundle bauen
        # Ohne Zertifikat im Runner wird ad-hoc signiert; das genuegt, um die
        # Bundle-Struktur und die Info.plist zu pruefen.
        run: ./build-app.sh
      - name: Bundle pruefen
        run: |
          test -x "dist/Teleprompter Mirror.app/Contents/MacOS/TeleprompterMirror"
          test -f "dist/Teleprompter Mirror.app/Contents/Resources/AppIcon.icns"
