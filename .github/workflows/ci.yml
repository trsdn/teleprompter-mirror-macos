name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  bundle:
    name: App bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate icon
        run: swift Scripts/make-icon.swift
      - name: Build bundle
        # Without a certificate in the runner, ad-hoc signing is used; this is
        # enough to check the bundle structure and Info.plist.
        run: ./build-app.sh
      - name: Check bundle
        run: |
          test -x "dist/Teleprompter Mirror.app/Contents/MacOS/TeleprompterMirror"
          test -f "dist/Teleprompter Mirror.app/Contents/Resources/AppIcon.icns"
