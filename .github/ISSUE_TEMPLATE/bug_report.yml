name: Fehler melden
description: Ein reproduzierbares Fehlverhalten der App melden.
title: "[Fehler]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Bericht. Bitte fülle die Felder möglichst vollständig aus –
        vor allem Quelle, Zielmonitor und macOS-Version sind für die Analyse wichtig.

  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was passiert, und was hättest du stattdessen erwartet?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Schritte zur Reproduktion
      placeholder: |
        1. App starten
        2. Quelle „Monitor“ wählen
        3. …
    validations:
      required: true

  - type: dropdown
    id: source
    attributes:
      label: Verwendete Quelle
      options:
        - Virtueller Monitor
        - Monitor
        - Fenster
        - Trifft nicht zu / unbekannt
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS-Version
      placeholder: "z. B. 15.3 oder 26.0"
    validations:
      required: true

  - type: input
    id: hardware
    attributes:
      label: Mac-Modell und Monitor-Aufbau
      placeholder: "z. B. MacBook Pro M3 mit einem externen 1920×1080-Monitor"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: App-Version
      description: Steht im Info-Dialog bzw. in `Config/Info.plist`.
      placeholder: "z. B. 1.0.1 (2)"

  - type: textarea
    id: logs
    attributes:
      label: Protokollausgabe
      description: |
        Optional, hilft aber sehr:
        `log show --last 5m --predicate 'subsystem == "com.github.trsdn.TeleprompterMirror"' --style compact`
      render: text
